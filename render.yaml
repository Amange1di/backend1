services:
  # Web service never imports fixtures or starts Telegram polling.
  - type: web
    name: backend1
    runtime: python
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://eduosh1.vercel.app
      - key: CORS_ALLOWED_ORIGINS
        value: https://eduosh1.vercel.app
      - key: CSRF_TRUSTED_ORIGINS
        value: https://eduosh1.vercel.app
      - key: ALLOWED_HOSTS
        value: backend1-ritn.onrender.com
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SYNC_SECRET
        sync: false
      - key: SYNC_TOKEN
        sync: false
      - key: SYNC_REMOTE_URL
        sync: false
    healthCheckPath: /api/public/info/

  # Telegram polling is a single separate process, never a Gunicorn worker.
  - type: worker
    name: backend1-telegram-bot
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python manage.py run_bot
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DEBUG
        value: "False"
      - key: FRONTEND_URL
        value: https://eduosh1.vercel.app
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false

  # Optional scheduled sync service. Configure its secret/token/remote URL
  # explicitly in Render before enabling it.
  - type: cron
    name: sync-servers
    runtime: python
    buildCommand: pip install -r requirements.txt
    schedule: "0 3 */2 * *"  # Каждые 2 дня в 03:00 UTC
    startCommand: python manage.py sync_servers --remote=$SYNC_REMOTE_URL
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DATABASE_URL
        sync: false
      - key: SYNC_SECRET
        sync: false
      - key: SYNC_TOKEN
        sync: false
      - key: SYNC_REMOTE_URL
        sync: false
